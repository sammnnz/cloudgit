#https://docs.docker.com/reference/compose-file/version-and-name/#version-top-level-element-obsolete
networks:
  cloudgit:

services:
  auth:
    restart: always
    build: ./backend/services/authentication
    container_name: auth
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: "1001:1001"
    networks:
      - cloudgit
    ports:
      - 127.0.0.1:8000:${AUTH_PORT}
    env_file:
      - ./.env
    environment:
    #https://ru.stackoverflow.com/questions/1513850/%D0%9F%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D0%B2-docker-%D0%BF%D0%B0%D0%B4%D0%B0%D0%B5%D1%82-%D0%BF%D1%80%D0%B8%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5
      DJANGO_DEBUG: ${DEBUG}
      DJANGO_POSTGRES_DB_NAME: cloudgit_auth
      DJANGO_POSTGRES_HOST: auth_db
      DJANGO_POSTGRES_PORT: ${POSTGRES_PORT}
      DJANGO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_POSTGRES_USER: ${POSTGRES_USER}
      DJANGO_SECRET_KEY: ${AUTH_SECRET_KEY}
      DJANGO_SETTINGS_MODULE: settings
      GUNICORN_PORT: ${AUTH_PORT}
      REMOTE_SERVER_URL: ${SCHEME}://${NGINX_EXT_HOST}:${NGINX_EXT_PORT}
    command: >
      sh -c "
      python ./manage.py migrate &&
      gunicorn -c gunicorn.conf.py wsgi:application"
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  auth_db:
    image: postgres:16
    container_name: auth_db
    networks:
      - cloudgit
    env_file:
      - ./.env
    environment:
      PGDATA: /var/lib/postgresql/data
      PGUSER: ${POSTGRES_USER}
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - 127.0.0.1:5430:${POSTGRES_PORT}
    volumes:
      - ~/.pg/pg_data/auth:/var/lib/postgresql/data
  
  pgadmin:
    restart: always
    image: dpage/pgadmin4:9.4
    container_name: pgadmin
    networks:
      - cloudgit
    env_file:
      - ./.env
    ports:
      - 127.0.0.1:5080:80
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  frontend:
    restart: always
    build:
      context: ./frontend
      args:
        VITE_DEBUG: ${DEBUG}
        VITE_BACKEND_URL: ${SCHEME}://${NGINX_EXT_HOST}
    env_file:
      - ./.env
    container_name: frontend
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - cloudgit

  nginx:
    restart: always
    image: nginx:1.29.0-alpine-slim
    container_name: nginx
    user: root
    env_file:
      - ./.env
    ports:
      - ${NGINX_EXT_HOST}:${NGINX_EXT_PORT}:80
    volumes:
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
      - './nginx/proxy_params:/etc/nginx/proxy_params'
    networks:
      - cloudgit
    depends_on:
      - frontend
      - auth

