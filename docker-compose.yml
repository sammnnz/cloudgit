#https://docs.docker.com/reference/compose-file/version-and-name/#version-top-level-element-obsolete
networks:
  cloudgit:

services:
  # docker build -t cloudgit-auth --build-context common=./backend/common  backend/services/auth
  auth:
    restart: always
    image: cloudgit-auth:latest
    container_name: auth
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    user: "1001:1001"
    networks:
      - cloudgit
    ports:
      - 127.0.0.1:8000:${AUTH_PORT}
    env_file:
      - ./.env
    environment:
      DJANGO_DEBUG: ${DEBUG}
      DJANGO_RABBITMQ_HOST: rabbitmq
      DJANGO_RABBITMQ_PORT: ${RABBITMQ_NODE_PORT}
      DJANGO_RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      DJANGO_RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      DJANGO_RABBITMQ_QUEUE: cloudgit_auth
      DJANGO_POSTGRES_DB_NAME: cloudgit_auth
      DJANGO_POSTGRES_HOST: auth_db
      DJANGO_POSTGRES_PORT: ${POSTGRES_PORT}
      DJANGO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_POSTGRES_USER: ${POSTGRES_USER}
      DJANGO_SECRET_KEY: ${AUTH_SECRET_KEY}
      DJANGO_SETTINGS_MODULE: settings
      GUNICORN_PORT: ${AUTH_PORT}
      REMOTE_SERVER_URL: ${SCHEME}://${NGINX_EXT_HOST}:${NGINX_EXT_PORT}
    command: >
      sh -c "
      python ./manage.py migrate &&
      gunicorn -c gunicorn.conf.py wsgi:application"
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_started
        restart: true

  auth_db:
    restart: always
    image: postgres:16
    container_name: auth_db
    networks:
      - cloudgit
    env_file:
      - ./.env
    environment:
      PGDATA: /var/lib/postgresql/data
      PGUSER: ${POSTGRES_USER}
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - 127.0.0.1:5430:${POSTGRES_PORT}
    volumes:
      - ~/.pg/pg_data/auth:/var/lib/postgresql/data
  
  pgadmin:
    restart: always
    image: dpage/pgadmin4:9.4
    container_name: pgadmin
    networks:
      - cloudgit
    env_file:
      - ./.env
    environment:
      PGUSER: ${POSTGRES_USER}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - 127.0.0.1:5080:80
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  frontend:
    restart: always
    build:
      context: ./frontend
      args:
        VITE_DEBUG: ${DEBUG}
        VITE_BACKEND_URL: ${SCHEME}://${NGINX_EXT_HOST}
    env_file:
      - ./.env
    container_name: frontend
    ports:
      - 127.0.0.1:3000:${FRONTEND_PORT}
    networks:
      - cloudgit

  rabbitmq:
    restart: always
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    env_file:
      - ./.env
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,error},{default,error}] disk_free_limit 536870912
    ports:
      - 127.0.0.1:5672:${RABBITMQ_NODE_PORT} # AMQP
      - 127.0.0.1:15672:15672                # management
    volumes:
      - ~/.rabbitmq/data:/var/lib/rabbitmq

  nginx:
    restart: always
    build:
      context: ./nginx
      args:
        AUTH_PORT: ${AUTH_PORT}
        FRONTEND_PORT: ${FRONTEND_PORT}
        RABBITMQ_NODE_PORT: ${RABBITMQ_NODE_PORT}
    container_name: nginx
    user: "1002:1001"
    env_file:
      - ./.env
    ports:
      - ${NGINX_EXT_HOST}:${NGINX_EXT_PORT}:80
    networks:
      - cloudgit
    depends_on:
      - rabbitmq
      - frontend
      - auth
