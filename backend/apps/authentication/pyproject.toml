[project]
name = "authentication"
version = "0.1.0"
description = "Auth service for CloudGit WEB Application"
authors = [
    {name = "Sam Nazarov",email = "samnnazarov@gmail.com"}
]
readme = "README.md"
requires-python = "~3.10"
dependencies = [
    "django (>=5.2.1,<6.0.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "setuptools (>=80.8.0,<81.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "gunicorn[gevent] (>=23.0.0,<24.0.0)",
]

[project.optional-dependencies]
postgres = [
    'psycopg2'
]

[tool.poetry]
packages = [
    {include = "authentication", from = "../"}
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
