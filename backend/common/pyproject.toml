[project]
name = "common"
version = "0.1.0"
description = "Common utils for CloudGIT backend"
license = "Apache-2.0"
authors = [
    {name = "Sam Nazarov", email = "samnnazarov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
#    "pika (>=1.3.2,<2.0.0)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "django-ninja (>=1.4.3,<2.0.0)",
]

[project.optional-dependencies]
#deps = [
#    "pika (>=1.3.2,<2.0.0)"
#]

[tool.poetry]
packages = [
    {include = "common", from = "src"},
#    {include = "common", from = "../"},  # for project structure without 'src' folder
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
