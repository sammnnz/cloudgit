user root;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
   upstream auth {
      least_conn;
      server auth:8000 max_fails=5 fail_timeout=60s;
   }
# TODO: https://www.baeldung.com/linux/nginx-config-environment-variables
   server {
      listen 80;
      
      server_name localhost;

      location / {
          include proxy_params;
          proxy_pass http://frontend:3000/;
          proxy_redirect off;
          proxy_http_version 1.1;
      }
      
      location /api/auth/ {
          include proxy_params;
          proxy_pass http://auth/api/auth/;
          proxy_redirect off;
          proxy_http_version 1.1;
          #try_files $uri $uri/ =400;
      }
   }
}
